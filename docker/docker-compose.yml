version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: docuflow-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: docuflow_ai
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: docuflow-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/docuflow_ai
      JWT_SECRET: docuflow_super_secret_jwt_key_2026_mca_project
      JWT_EXPIRE: 7d
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - mongodb
      - ai-service
    volumes:
      - ../storage/uploads:/app/storage/uploads

  ai-service:
    build:
      context: ../ai-service
      dockerfile: ../docker/Dockerfile.ai
    container_name: docuflow-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      AI_SERVICE_PORT: 8000
      OLLAMA_API_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3:8b

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: docuflow-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
